# Weekly updates, one grouped PR per ecosystem, commits prefixed chore(deps)
version: 2
updates:
  # Actions are pinned by SHA, the version comment next to each pin is updated with it
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  # Minifiers, linters and Playwright used by the workflows, pinned in package-lock.json
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-dependencies:
        patterns:
          - "*"
