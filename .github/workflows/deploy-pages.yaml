name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Download repository code to runner
      - name: Checkout code
        uses: actions/checkout@v6

      # Configure Node.js environment for minification tools
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # Minify HTML, CSS, and JavaScript files
      - name: Minify files
        run: |
          npm install html-minifier-terser terser clean-css-cli
          mkdir -p dist
          npx html-minifier-terser --collapse-whitespace --remove-comments --minify-css true --minify-js true src/index.html -o dist/index.html
          npx terser src/script.js --compress --mangle --comments false -o dist/script.js
          npx cleancss -o dist/style.css src/style.css

      # Configure GitHub Pages settings
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Upload minified files as Pages artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

      # Deploy artifact to GitHub Pages
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
